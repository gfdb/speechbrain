# ################################
# Isolated Augmentation Testing with SpeechBrain Native Augmentations
# 
# This config allows testing individual SpeechBrain augmentations in isolation
# for comparison against wav2aug implementations.
#
# Usage:
#   # Test drop_chunk (time dropout) augmentation:
#   python train.py hparams/single_aug_sb.yaml --augmentation_name=drop_chunk
#
#   # Test drop_freq (frequency dropout) augmentation:
#   python train.py hparams/single_aug_sb.yaml --augmentation_name=drop_freq
#
#   # Test with no augmentation (baseline):
#   python train.py hparams/single_aug_sb.yaml --augmentation_name=none
#
# Available augmentation names:
#   - add_noise      : Add background noise at random SNR
#   - speed_perturb  : Speed perturbation
#   - drop_freq      : Frequency band dropout
#   - drop_chunk     : Time dropout
#   - clipping       : Amplitude clipping (DoClip)
#   - rand_amp       : Random amplitude scaling (RandAmp)
#   - sign_flip      : Polarity inversion (SignFlip)
#   - chunk_swap     : Swap audio chunks (ChunkSwap)
#   - babble_noise   : Add babble noise from batch sum
#   - none           : No augmentation (baseline)
# ################################

# Basic parameters
seed: 1986
__set_seed: !apply:speechbrain.utils.seed_everything [!ref <seed>]

number_of_commands: 12
output_folder: !ref results/single_aug_sb_<augmentation_name>/<seed>
save_folder: !ref <output_folder>/save
train_log: !ref <output_folder>/train_log.txt

# Data files
data_folder: !PLACEHOLDER
train_annotation: !ref <output_folder>/train.csv
valid_annotation: !ref <output_folder>/valid.csv
test_annotation: !ref <output_folder>/test.csv

# Data for augmentation
data_folder_noise: !ref <data_folder>/noise
NOISE_DATASET_URL: https://www.dropbox.com/scl/fi/a09pj97s5ifan81dqhi4n/noises.zip?rlkey=j8b0n9kdjdr32o1f06t0cw5b7&dl=1
noise_annotation: !ref <output_folder>/noise.csv

# ============================================================================
# AUGMENTATION SELECTION - Override via CLI: --augmentation_name=drop_chunk
# ============================================================================
augmentation_name: none

# Waveform Augmentation Values
snr_low: 0
snr_high: 10
speed_changes: [90, 100, 110]
drop_freq_low: 0
drop_freq_high: 1
drop_freq_count_low: 1
drop_freq_count_high: 8
drop_freq_width: 0.1
drop_chunk_count_low: 1
drop_chunk_count_high: 8
drop_chunk_length_low: 0
drop_chunk_length_high: 4000
clip_low: 0
clip_high: 0.75
amp_low: 0.05
amp_high: 0.5
sign_flip_prob: 0.6
chunk_size_frac: 0.01
num_chunks: 4
babble_snr_low: 0
babble_snr_high: 20

validation_percentage: 10
testing_percentage: 10
percentage_unknown: 10
percentage_silence: 10

skip_prep: False
ckpt_interval_minutes: 15

####################### Training Parameters ####################################
number_of_epochs: 100
batch_size: 32
lr: 0.001
lr_final: 0.0001

sample_rate: 16000
shuffle: True

n_mels: 24
left_frames: 0
right_frames: 0
deltas: False

out_n_neurons: !ref <number_of_commands>

num_workers: 4
dataloader_options:
    batch_size: !ref <batch_size>
    shuffle: !ref <shuffle>
    num_workers: !ref <num_workers>

compute_features: !new:speechbrain.lobes.features.Fbank
    n_mels: !ref <n_mels>
    left_frames: !ref <left_frames>
    right_frames: !ref <right_frames>
    deltas: !ref <deltas>

embedding_model: !new:speechbrain.lobes.models.Xvector.Xvector
    in_channels: !ref <n_mels>
    activation: !name:torch.nn.LeakyReLU
    tdnn_blocks: 5
    tdnn_channels: [512, 512, 512, 512, 1500]
    tdnn_kernel_sizes: [5, 3, 3, 1, 1]
    tdnn_dilations: [1, 2, 3, 1, 1]
    lin_neurons: 512

classifier: !new:speechbrain.lobes.models.Xvector.Classifier
    input_shape: [null, null, 512]
    activation: !name:torch.nn.LeakyReLU
    lin_blocks: 1
    lin_neurons: 512
    out_neurons: !ref <out_n_neurons>

softmax: !new:speechbrain.nnet.activations.Softmax
    apply_log: True

epoch_counter: !new:speechbrain.utils.epoch_loop.EpochCounter
    limit: !ref <number_of_epochs>

prepare_noise_data: !name:speechbrain.augment.preparation.prepare_dataset_from_URL
    URL: !ref <NOISE_DATASET_URL>
    dest_folder: !ref <data_folder_noise>
    ext: wav
    csv_file: !ref <noise_annotation>

# ============================================================================
# SpeechBrain Native Augmentations - Define all, select one via augmentation_name
# ============================================================================

# Add noise
sb_add_noise: !new:speechbrain.augment.time_domain.AddNoise
    csv_file: !ref <noise_annotation>
    snr_low: !ref <snr_low>
    snr_high: !ref <snr_high>
    noise_sample_rate: !ref <sample_rate>
    clean_sample_rate: !ref <sample_rate>
    num_workers: 0

# Speed perturbation
sb_speed_perturb: !new:speechbrain.augment.time_domain.SpeedPerturb
    orig_freq: !ref <sample_rate>
    speeds: !ref <speed_changes>

# Frequency drop
sb_drop_freq: !new:speechbrain.augment.time_domain.DropFreq
    drop_freq_low: !ref <drop_freq_low>
    drop_freq_high: !ref <drop_freq_high>
    drop_freq_count_low: !ref <drop_freq_count_low>
    drop_freq_count_high: !ref <drop_freq_count_high>
    drop_freq_width: !ref <drop_freq_width>

# Time drop (drop_chunk)
sb_drop_chunk: !new:speechbrain.augment.time_domain.DropChunk
    drop_length_low: !ref <drop_chunk_length_low>
    drop_length_high: !ref <drop_chunk_length_high>
    drop_count_low: !ref <drop_chunk_count_low>
    drop_count_high: !ref <drop_chunk_count_high>

# Clipping
sb_clipping: !new:speechbrain.augment.time_domain.DoClip
    clip_low: !ref <clip_low>
    clip_high: !ref <clip_high>

# Random Amplitude
sb_rand_amp: !new:speechbrain.augment.time_domain.RandAmp
    amp_low: !ref <amp_low>
    amp_high: !ref <amp_high>

# SignFlip
sb_sign_flip: !new:speechbrain.augment.time_domain.SignFlip
    flip_prob: !ref <sign_flip_prob>

# ChunkSwap
sb_chunk_swap: !new:speechbrain.augment.time_domain.ChunkSwap
    num_chunks: !ref <num_chunks>
    chunk_size_frac: !ref <chunk_size_frac>

# Babble noise
sum_batch: !name:torch.sum
    dim: 0
    keepdim: True

sb_babble_noise: !new:speechbrain.augment.time_domain.AddNoise
    snr_low: !ref <babble_snr_low>
    snr_high: !ref <babble_snr_high>
    noise_funct: !ref <sum_batch>

# ============================================================================
# Augmentation selector using SpeechBrain's Augmenter with single augmentation
# Note: Only one augmentation can be active at a time. To switch, you need to
# modify the augmentations list below or use separate YAML files per augmentation.
# For automated switching, use the run_single_aug.py script with --backend=speechbrain
# ============================================================================

# Default: use drop_chunk for testing. Change this list to test other augmentations.
# The run_single_aug.py script can generate per-augmentation configs automatically.
wav_augment: !new:speechbrain.augment.augmenter.Augmenter
    parallel_augment: False
    concat_original: False
    repeat_augment: 1
    shuffle_augmentations: False
    min_augmentations: 1
    max_augmentations: 1
    # Change this to test different augmentations:
    # Options: sb_add_noise, sb_speed_perturb, sb_drop_freq, sb_drop_chunk,
    #          sb_clipping, sb_rand_amp, sb_sign_flip, sb_chunk_swap, sb_babble_noise
    augmentations: [!ref <sb_drop_chunk>]

mean_var_norm: !new:speechbrain.processing.features.InputNormalization
    norm_type: sentence
    std_norm: False

modules:
    compute_features: !ref <compute_features>
    embedding_model: !ref <embedding_model>
    classifier: !ref <classifier>
    softmax: !ref <softmax>
    mean_var_norm: !ref <mean_var_norm>

compute_cost: !name:speechbrain.nnet.losses.nll_loss

weight_decay: 0.000002
opt_class: !name:torch.optim.AdamW
    lr: !ref <lr>
    weight_decay: !ref <weight_decay>

lr_annealing: !new:speechbrain.nnet.schedulers.LinearScheduler
    initial_value: !ref <lr>
    final_value: !ref <lr_final>
    epoch_count: !ref <number_of_epochs>

train_logger: !new:speechbrain.utils.train_logger.FileTrainLogger
    save_file: !ref <train_log>

error_stats: !name:speechbrain.utils.metric_stats.MetricStats
    metric: !name:speechbrain.nnet.losses.classification_error
        reduction: batch

checkpointer: !new:speechbrain.utils.checkpoints.Checkpointer
    checkpoints_dir: !ref <save_folder>
    recoverables:
        embedding_model: !ref <embedding_model>
        classifier: !ref <classifier>
        normalizer: !ref <mean_var_norm>
        counter: !ref <epoch_counter>
